{% extends "base.html" %}
{% block title %}{{ 'Edit' if action == 'edit' else 'New' }} Visit{% endblock %}
{% block page_title %}{{ 'Edit' if action == 'edit' else 'New' }} Visit{% endblock %}

{% block content %}
<div class="card shadow-sm">
    <div class="card-body">
        <form method="POST">
            {% include 'components/dynamic_form.html' %}

            <div class="mt-4">
                <button type="submit" class="btn btn-success">
                    <i class="bi bi-check-lg"></i> {{ 'Update' if action == 'edit' else 'Create' }} Visit
                </button>
                <a href="{{ url_for('visits.visits_list') }}" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", function() {
    const doctorSelect = document.getElementById('doctorSelect');
    const departmentSelect = document.getElementById('departmentSelect');

    function updateDepartment() {
        if (!doctorSelect || !departmentSelect) return;
        const selectedOption = doctorSelect.options[doctorSelect.selectedIndex];
        const dept = selectedOption.getAttribute('data-department');
        
        if (dept) {
            for (let i = 0; i < departmentSelect.options.length; i++) {
                if (departmentSelect.options[i].value === dept) {
                    departmentSelect.selectedIndex = i;
                    break;
                }
            }
        } else {
            departmentSelect.selectedIndex = 0;
        }
    }

    if (doctorSelect) {
        doctorSelect.addEventListener('change', updateDepartment);
        // Run once on load to handle pre-selected doctors (e.g. on edit)
        updateDepartment();
    }
});
</script>
{% endblock %}
